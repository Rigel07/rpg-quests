name: Build RPGQuests

# Sube a tu repositorio el .zip del mod TAL CUAL (sin descomprimir) junto con este archivo en
# .github/workflows/build.yml. GitHub lo abre, compila y deja el .jar en Actions -> Artifacts.
# Tambien funciona si subes el proyecto ya descomprimido (aunque este dentro de una carpeta).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ForgeGradle 6.0 + Forge 1.20.1 necesita Gradle 8.1.1 (el proyecto no trae gradlew)
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1

      - name: Preparar y compilar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist work

          # Reintenta solo si falla una descarga puntual (Forge Maven, Mojang...).
          # Un error de compilacion NO se reintenta: se muestra y termina.
          run_gradle() {
            local attempt=1
            local log
            log="$(mktemp)"
            while true; do
              if "$@" 2>&1 | tee "$log"; then
                return 0
              fi
              if grep -qE 'error: |compileJava FAILED|Compilation failed' "$log"; then
                echo "::error::Error de compilacion en el codigo del mod (no se reintenta). Mira las lineas con 'error:' del log."
                return 1
              fi
              if [ "$attempt" -ge 3 ]; then
                return 1
              fi
              echo "::warning::El build fallo (intento $attempt de 3), probablemente por la red. Reintentando en 20 s..."
              attempt=$((attempt + 1))
              sleep 20
            done
          }

          build_project() {
            local dir="$1"
            echo "::group::Compilando $dir"
            (
              cd "$dir"
              if [ -f gradlew ]; then
                chmod +x gradlew
                run_gradle ./gradlew build --no-daemon --console=plain
              else
                run_gradle gradle build --no-daemon --console=plain
              fi
            )
            if [ -d "$dir/build/libs" ]; then
              find "$dir/build/libs" -maxdepth 1 -name '*.jar' \
                ! -name '*-sources.jar' ! -name '*-javadoc.jar' \
                -exec cp -v {} dist/ \;
            fi
            echo "::endgroup::"
          }

          found=0

          # 1) Cada .zip del repo se descomprime y se compila
          while IFS= read -r -d '' zip; do
            name="$(basename "$zip" .zip | tr ' ()' '___')"
            echo "Encontrado zip: $zip"
            mkdir -p "work/$name"
            unzip -q -o "$zip" -d "work/$name"
            # build.gradle puede estar en la raiz del zip o dentro de una carpeta
            gradle_file="$(find "work/$name" \( -name build.gradle -o -name build.gradle.kts \) -not -path '*/build/*' -print -quit)"
            if [ -z "$gradle_file" ]; then
              echo "::warning::$zip no contiene build.gradle, se ignora."
              continue
            fi
            build_project "$(dirname "$gradle_file")"
            found=1
          done < <(find . -maxdepth 3 -type f -name '*.zip' -not -path './.git/*' -not -path './work/*' -print0)

          # 2) Si no hay zips, compila el proyecto tal cual esta en el repo
          if [ "$found" -eq 0 ]; then
            gradle_file="$(find . \( -name build.gradle -o -name build.gradle.kts \) -not -path './work/*' -not -path '*/build/*' -not -path './.git/*' -print -quit)"
            if [ -z "$gradle_file" ]; then
              echo "::error::No hay ningun .zip ni build.gradle en el repositorio."
              exit 1
            fi
            build_project "$(dirname "$gradle_file")"
          fi

          # 3) Comprobar que el jar no esta vacio
          if ! ls dist/*.jar >/dev/null 2>&1; then
            echo "::error::No se genero ningun .jar."
            exit 1
          fi
          for jar in dist/*.jar; do
            classes="$(unzip -l "$jar" | grep -c '\.class' || true)"
            echo "$jar -> $classes clases"
            if [ "$classes" -eq 0 ]; then
              echo "::error::$jar no contiene clases (el codigo fuente no se encontro)."
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: dist/*.jar
          if-no-files-found: error
